name: Recheck review queue

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Check state/input
        id: input
        shell: bash
        run: |
          if [ -f data/raw/sociology_questions_5170.json ] && [ -f data/state/results.jsonl ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to recheck yet."
          fi

      - name: Re-run a bounded slice of REVIEW items
        if: steps.input.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          PYTHONPATH: src
          MAX_WORKERS: "4"
        run: python -m question_audit.pipeline --retry-status REVIEW --limit 40 --max-attempts 3

      - name: Re-export queues
        if: steps.input.outputs.ready == 'true'
        env:
          PYTHONPATH: src
        run: python -m question_audit.export

      - name: Commit refreshed queues
        if: steps.input.outputs.ready == 'true'
        run: |
          git config user.name "question-audit-bot"
          git config user.email "question-audit-bot@users.noreply.github.com"
          git add data/state data/output reports || true
          if ! git diff --cached --quiet; then
            git commit -m "refresh review queues"
            git push
          fi
