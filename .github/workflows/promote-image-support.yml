name: Promote Image Support Into PWA Package

on:
  push:
    branches:
      - feature/image-support-lab
    paths:
      - ".github/workflows/promote-image-support.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/image-support-lab

      - name: Patch and repack PWA
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Simulados_Ana_Dani_Humanas_FINAL_PWA.zip"
          test -f "$ZIP"
          rm -rf unpacked build new-pwa.zip
          mkdir -p unpacked build
          unzip -q "$ZIP" -d unpacked
          if [ -f unpacked/index.html ]; then
            cp -a unpacked/. build/
          else
            ROOT="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$ROOT" && test -f "$ROOT/index.html"
            cp -a "$ROOT"/. build/
          fi
          python3 scripts/patch_image_support.py build/index.html
          grep -q 'danieana-image-support-style' build/index.html
          if grep -q 'LAB-IMAGE-001' build/index.html; then
            echo 'Laboratory question must not enter production package.' >&2
            exit 1
          fi
          if grep -q 'REAL_IMAGE_LAB_ID' build/index.html; then
            echo 'Real-question laboratory must not enter production package.' >&2
            exit 1
          fi
          (cd build && zip -qr ../new-pwa.zip .)
          mv new-pwa.zip "$ZIP"

      - name: Commit production package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Simulados_Ana_Dani_Humanas_FINAL_PWA.zip
          if git diff --cached --quiet; then
            echo "PWA package already contains production image support."
            exit 0
          fi
          git commit -m "Add production image support to Dani&Ana PWA"
          git push origin HEAD:feature/image-support-lab
