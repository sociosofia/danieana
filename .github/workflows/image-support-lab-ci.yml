name: Image Support Production CI

on:
  push:
    branches:
      - feature/image-support-lab
    paths:
      - "scripts/patch_image_support.py"
      - ".github/workflows/image-support-lab-ci.yml"
      - "Simulados_Ana_Dani_Humanas_FINAL_PWA.zip"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/patch_image_support.py"
      - ".github/workflows/image-support-lab-ci.yml"
      - "Simulados_Ana_Dani_Humanas_FINAL_PWA.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build production candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Simulados_Ana_Dani_Humanas_FINAL_PWA.zip"
          test -f "$ZIP"
          rm -rf unpacked _site
          mkdir -p unpacked _site
          unzip -q "$ZIP" -d unpacked
          if [ -f unpacked/index.html ]; then
            cp -a unpacked/. _site/
          else
            ROOT="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$ROOT" && test -f "$ROOT/index.html"
            cp -a "$ROOT"/. _site/
          fi
          test -f _site/index.html
          python3 scripts/patch_image_support.py _site/index.html

      - name: Validate production image support
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'danieana-image-support-style' _site/index.html
          grep -q 'Baixando imagens das questões' _site/index.html
          grep -q 'QUESTION_IMAGE_CACHE="ana-dani-question-images-v1"' _site/index.html
          grep -q 'start=async function(...args)' _site/index.html
          grep -q 'renderQuestionMedia(q);' _site/index.html
          if grep -q 'LAB-IMAGE-001' _site/index.html; then
            echo 'Synthetic laboratory question leaked into production candidate.' >&2
            exit 1
          fi
          if grep -q 'REAL_IMAGE_LAB_ID' _site/index.html; then
            echo 'Real-question laboratory route leaked into production candidate.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('_site/index.html').read_text(encoding='utf-8')
          app_start=html.index('function startHumanasApp(){')
          logic=html.index('const DANIEANA_IMAGE_ORIGINAL_START=start;')
          app_end=html.index('\n}\n\n\n(async()=>',app_start)
          if not (app_start < logic < app_end):
              raise SystemExit('image support logic escaped startHumanasApp scope')
          m=re.search(r'<script>\s*(function startHumanasApp\(\).*?)</script>',html,re.S)
          if not m:
              raise SystemExit('main application script not found')
          Path('/tmp/danieana-app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/danieana-app.js

      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: danieana-image-support-production-candidate
          path: _site
          retention-days: 7
