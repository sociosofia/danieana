name: Deploy DaniAna and HeloeSthe
# diagnostic PR: exercise the real Pages deployment path

on:
  push:
    branches: [main]
    paths:
      - "Simulados_Ana_Dani_Humanas_FINAL_PWA.zip"
      - "scripts/patch_safe_update.py"
      - "scripts/stage_heloesthe_subsite.py"
      - "scripts/patch_heloesthe_subsite.py"
      - "branding/heloesthe/**"
      - ".github/workflows/deploy-simulados.yml"
  pull_request:
    branches: [main]
    paths:
      - "Simulados_Ana_Dani_Humanas_FINAL_PWA.zip"
      - "scripts/patch_safe_update.py"
      - "scripts/stage_heloesthe_subsite.py"
      - "scripts/patch_heloesthe_subsite.py"
      - "branding/heloesthe/**"
      - ".github/workflows/deploy-simulados.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare DaniAna from official PWA package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Simulados_Ana_Dani_Humanas_FINAL_PWA.zip"
          test -f "$ZIP" || { echo "Missing $ZIP"; exit 1; }
          rm -rf unpacked _site
          mkdir -p unpacked _site
          unzip -q "$ZIP" -d unpacked
          if [ -f unpacked/index.html ]; then
            cp -a unpacked/. _site/
          else
            ROOT="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$ROOT" && test -f "$ROOT/index.html" || {
              echo "index.html not found in package"
              find unpacked -maxdepth 3 -type f | head -100
              exit 1
            }
            cp -a "$ROOT"/. _site/
          fi
          test -f _site/index.html
          grep -q 'const DANIEANA_DOCX_REPORT_SHARE_V1=true;' _site/index.html
          grep -q 'Compartilhar relatório DOCX' _site/index.html

      - name: Add safe DaniAna update system
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_safe_update.py _site "$GITHUB_SHA"

      - name: Build isolated HeloeSthe subsite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stage_heloesthe_subsite.py _site _site/heloesthe
          python3 scripts/patch_heloesthe_subsite.py _site/heloesthe

          mkdir -p _site/heloesthe/icons
          base64 -d branding/heloesthe/icon-192.png.b64 > _site/heloesthe/icons/icon-192.png
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
            "https://raw.githubusercontent.com/sociosofia/heloesthe/main/branding/icon-512.png.b64" \
            | base64 -d > _site/heloesthe/icons/icon-512.png

          file _site/heloesthe/icons/icon-192.png | grep -qi 'PNG image data, 192 x 192'
          file _site/heloesthe/icons/icon-512.png | grep -qi 'PNG image data, 512 x 512'
          grep -q 'HeloeSthe' _site/heloesthe/index.html
          grep -q 'Feito com afeto, para vocês. Estou na torcida!' _site/heloesthe/index.html
          grep -q 'heloesthe-local-storage-namespace' _site/heloesthe/index.html
          grep -q 'Compartilhar relatório DOCX' _site/heloesthe/index.html
          grep -q 'navigator.share' _site/heloesthe/index.html
          if grep -q 'Simulados da Ana e Dani' _site/heloesthe/index.html; then
            echo 'DaniAna branding leaked into HeloeSthe.' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('_site/heloesthe/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          if not scripts:
              raise SystemExit('No HeloeSthe inline application script found')
          Path('/tmp/heloesthe-main.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/heloesthe-main.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
