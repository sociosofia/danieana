name: Deploy Simulados da Ana e Dani

on:
  push:
    branches: [main]
    paths:
      - "Simulados_Ana_Dani_Humanas_FINAL_PWA.zip"
      - ".github/workflows/deploy-simulados.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare site from final PWA package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Simulados_Ana_Dani_Humanas_FINAL_PWA.zip"
          test -f "$ZIP" || { echo "Missing $ZIP"; exit 1; }
          rm -rf unpacked _site
          mkdir -p unpacked _site
          unzip -q "$ZIP" -d unpacked
          if [ -f unpacked/index.html ]; then
            cp -a unpacked/. _site/
          else
            ROOT="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$ROOT" && test -f "$ROOT/index.html" || { echo "index.html not found in package"; find unpacked -maxdepth 3 -type f | head -100; exit 1; }
            cp -a "$ROOT"/. _site/
          fi
          test -f _site/index.html

      - name: Enable native report sharing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Exportar relatório TXT para discussão', 'Compartilhar relatório', 1)
          old = '$("#exportTeacher").onclick=()=>{\n            if(!last)return;\n            const chosen=$$(".discCheck").filter(x=>x.checked).length;\n            if(!chosen){alert("Selecione pelo menos uma questão para discussão.");return}\n            const blob=new Blob([teacherReportText()],{type:"text/plain;charset=utf-8"});\n            const a=document.createElement("a");\n            a.href=URL.createObjectURL(blob);\n            a.download=`relatorio_discussao_professor_${new Date().toISOString().slice(0,10)}.txt`;\n            document.body.appendChild(a);a.click();a.remove();\n            setTimeout(()=>URL.revokeObjectURL(a.href),1000);\n          };'
          new = '$("#exportTeacher").onclick=async()=>{\n            if(!last)return;\n            const chosen=$$(".discCheck").filter(x=>x.checked).length;\n            if(!chosen){alert("Selecione pelo menos uma questão para discussão.");return}\n            const report=teacherReportText();\n            const filename=`relatorio_discussao_professor_${new Date().toISOString().slice(0,10)}.txt`;\n            const file=new File([report],filename,{type:"text/plain"});\n            const title="Relatório de Ciências Humanas — Ana e Dani";\n            try{\n              if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){await navigator.share({title,text:"Relatório para discussão com o professor",files:[file]});return}\n              if(navigator.share){await navigator.share({title,text:report});return}\n            }catch(err){if(err?.name==="AbortError")return;console.warn("Compartilhamento nativo indisponível; usando download.",err)}\n            const blob=new Blob([report],{type:"text/plain;charset=utf-8"});\n            const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);\n          };'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add safe app update system
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os, re
          version = os.environ.get('GITHUB_SHA', 'local')[:12]
          sw_path = Path('_site/sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r'const CACHE_NAME="[^"]+";', f'const CACHE_PREFIX="ana-dani-humanas-";\nconst CACHE_NAME=CACHE_PREFIX+"{version}";', sw, count=1)
          sw = sw.replace('  self.skipWaiting();\n', '').replace('self.skipWaiting();\n', '')
          sw = re.sub(r'caches\.keys\(\)\.then\(keys=>Promise\.all\(keys\.filter\(k=>k!==CACHE_NAME\)\.map\(k=>caches\.delete\(k\)\)\)\)', 'caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith(CACHE_PREFIX) && k!==CACHE_NAME).map(k=>caches.delete(k))))', sw, count=1)
          if 'SKIP_WAITING' not in sw:
              marker = 'self.addEventListener("fetch",event=>{'
              handler = '\nself.addEventListener("message",event=>{\n  if(event.data?.type==="SKIP_WAITING") self.skipWaiting();\n});\n\n'
              if marker not in sw:
                  raise SystemExit('fetch handler marker not found')
              sw = sw.replace(marker, handler + marker, 1)
          sw_path.write_text(sw, encoding='utf-8')
          html_path = Path('_site/index.html')
          html = html_path.read_text(encoding='utf-8')
          updater = base64.b64decode('').decode('utf-8')
          if 'id="danieana-update-script"' not in html:
              if '</body>' not in html:
                  raise SystemExit('closing body tag not found')
              html = html.replace('</body>', updater + '\n</body>', 1)
          html_path.write_text(html, encoding='utf-8')
          print('App update version:', version)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
