name: Bake HeloeSthe subsite into DaniAna PWA
# Triggered after initial workflow registration on main.

on:
  push:
    branches: [main]
    paths:
      - "Simulados_Ana_Dani_Humanas_FINAL_PWA.zip"
      - "scripts/stage_heloesthe_subsite.py"
      - ".github/workflows/bake-heloesthe-subsite.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-heloesthe-subsite
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Bake HeloeSthe into official package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Simulados_Ana_Dani_Humanas_FINAL_PWA.zip"
          test -f "$ZIP"
          rm -rf unpacked
          mkdir -p unpacked
          unzip -q "$ZIP" -d unpacked

          if [ -f unpacked/index.html ]; then
            SITE="unpacked"
          else
            SITE="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$SITE" && test -f "$SITE/index.html"
          fi

          ROOT_SHA="$(sha256sum "$SITE/index.html" | awk '{print $1}')"
          if [ -f "$SITE/heloesthe/.source-sha" ] \
            && [ "$(cat "$SITE/heloesthe/.source-sha")" = "$ROOT_SHA" ] \
            && grep -q 'HeloeSthe' "$SITE/heloesthe/index.html" \
            && grep -q 'Compartilhar relatório DOCX' "$SITE/heloesthe/index.html" \
            && test -s "$SITE/heloesthe/icons/icon-192.png" \
            && test -s "$SITE/heloesthe/icons/icon-512.png"; then
            echo "HeloeSthe subsite already matches current DaniAna package."
            echo "BAKED=0" >> "$GITHUB_ENV"
            exit 0
          fi

          python3 scripts/stage_heloesthe_subsite.py "$SITE" "$SITE/heloesthe"

          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
            "https://raw.githubusercontent.com/sociosofia/heloesthe/main/scripts/bootstrap_heloesthe.py" \
            -o /tmp/bootstrap_heloesthe.py
          python3 /tmp/bootstrap_heloesthe.py "$SITE/heloesthe"

          mkdir -p "$SITE/heloesthe/icons"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
            "https://raw.githubusercontent.com/sociosofia/heloesthe/main/branding/icon-192.png.b64" \
            | base64 -d > "$SITE/heloesthe/icons/icon-192.png"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
            "https://raw.githubusercontent.com/sociosofia/heloesthe/main/branding/icon-512.png.b64" \
            | base64 -d > "$SITE/heloesthe/icons/icon-512.png"

          printf '%s' "$ROOT_SHA" > "$SITE/heloesthe/.source-sha"

          test -f "$SITE/heloesthe/index.html"
          grep -q 'HeloeSthe' "$SITE/heloesthe/index.html"
          grep -q 'Feito com afeto, para vocês. Estou na torcida!' "$SITE/heloesthe/index.html"
          grep -q 'heloesthe-local-storage-namespace' "$SITE/heloesthe/index.html"
          grep -q 'Compartilhar relatório DOCX' "$SITE/heloesthe/index.html"
          grep -q 'navigator.share' "$SITE/heloesthe/index.html"
          file "$SITE/heloesthe/icons/icon-192.png" | grep -qi 'PNG image data, 192 x 192'
          file "$SITE/heloesthe/icons/icon-512.png" | grep -qi 'PNG image data, 512 x 512'
          if grep -q 'Simulados da Ana e Dani' "$SITE/heloesthe/index.html"; then
            echo "Original Dani&Ana branding leaked into HeloeSthe." >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('unpacked/heloesthe/index.html') if Path('unpacked/heloesthe/index.html').exists() else next(Path('unpacked').glob('*/heloesthe/index.html'))
          s=html.read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/heloesthe-main.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/heloesthe-main.js

          rm -f "${ZIP}.new"
          (cd unpacked && zip -qr "../${ZIP}.new" .)
          mv "${ZIP}.new" "$ZIP"
          echo "BAKED=1" >> "$GITHUB_ENV"

      - name: Commit combined package
        if: env.BAKED == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Simulados_Ana_Dani_Humanas_FINAL_PWA.zip
          git diff --cached --quiet && exit 0
          git commit -m "Bake HeloeSthe subsite into PWA package"
          git push origin HEAD:main
