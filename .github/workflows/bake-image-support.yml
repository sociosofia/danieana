name: Bake Image Support into PWA

on:
  push:
    branches: [main]
    paths:
      - "Simulados_Ana_Dani_Humanas_FINAL_PWA.zip"
      - "scripts/patch_image_support.py"
      - "scripts/patch_image_dependent_batch_1.py"
      - "scripts/patch_report_docx_share.py"
      - "scripts/stage_heloesthe_subsite.py"
      - ".github/workflows/bake-image-support.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-image-support
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Bake image support, DOCX reporting and HeloeSthe into official PWA package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Simulados_Ana_Dani_Humanas_FINAL_PWA.zip"
          test -f "$ZIP"
          rm -rf unpacked
          mkdir unpacked
          unzip -q "$ZIP" -d unpacked

          if [ -f unpacked/index.html ]; then
            INDEX="unpacked/index.html"
            SITE_ROOT="unpacked"
          else
            ROOT="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$ROOT" && test -f "$ROOT/index.html"
            INDEX="$ROOT/index.html"
            SITE_ROOT="$ROOT"
          fi

          MEDIA="$SITE_ROOT/media/image-dependent"
          HELO="$SITE_ROOT/heloesthe"
          ROOT_SHA="$(sha256sum "$INDEX" | awk '{print $1}')"

          BASE_READY=0
          if grep -q 'id="danieana-image-support-style"' "$INDEX" \
            && grep -q 'const IMAGE_DEPENDENT_BATCH_1=' "$INDEX" \
            && grep -q 'const DANIEANA_DOCX_REPORT_SHARE_V1=true;' "$INDEX" \
            && test -s "$MEDIA/q_4000245684.png" \
            && test -s "$MEDIA/q_4000146570.jpeg" \
            && test -s "$MEDIA/q_4000037773.png" \
            && test -s "$MEDIA/q_4000305647.png" \
            && test -s "$MEDIA/q_4000084413.png"; then
            BASE_READY=1
          fi

          HELO_READY=0
          if [ -f "$HELO/.source-sha" ] \
            && [ "$(cat "$HELO/.source-sha")" = "$ROOT_SHA" ] \
            && grep -q 'HeloeSthe' "$HELO/index.html" \
            && grep -q 'Feito com afeto, para vocês. Estou na torcida!' "$HELO/index.html" \
            && grep -q 'Compartilhar relatório DOCX' "$HELO/index.html" \
            && test -s "$HELO/icons/icon-192.png" \
            && test -s "$HELO/icons/icon-512.png"; then
            HELO_READY=1
          fi

          if [ "$BASE_READY" = "1" ] && [ "$HELO_READY" = "1" ]; then
            echo "DaniAna base and HeloeSthe subsite are already baked into the package."
            echo "BAKED=0" >> "$GITHUB_ENV"
            exit 0
          fi

          if ! grep -q 'id="danieana-image-support-style"' "$INDEX"; then
            python3 scripts/patch_image_support.py "$INDEX"
          fi

          mkdir -p "$MEDIA"
          if [ ! -s "$MEDIA/q_4000245684.png" ]; then
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
              "https://bq.drivedepobre.com/bq/img/83c94b0999c1ef9f4fd2ec709a1fb2fa2e2e5901.png" \
              -o "$MEDIA/q_4000245684.png"
          fi
          if [ ! -s "$MEDIA/q_4000146570.jpeg" ]; then
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
              "https://bq.drivedepobre.com/bq/img/797f5e117aaef8f8420ac8754426ec866c40833b.jpeg" \
              -o "$MEDIA/q_4000146570.jpeg"
          fi
          if [ ! -s "$MEDIA/q_4000037773.png" ]; then
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
              "https://bq.drivedepobre.com/bq/img/70fc356d12f663bb8afbd955d3138ed12fb42718.png" \
              -o "$MEDIA/q_4000037773.png"
          fi
          if [ ! -s "$MEDIA/q_4000305647.png" ]; then
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
              "https://bq.drivedepobre.com/bq/img/eec00dc390ee45763dc6369c2fc139e558fbc1c7.png" \
              -o "$MEDIA/q_4000305647.png"
          fi
          if [ ! -s "$MEDIA/q_4000084413.png" ]; then
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
              "https://bq.drivedepobre.com/bq/img/822e3c514b208005101a0542792a6b31f684ed56.png" \
              -o "$MEDIA/q_4000084413.png"
          fi

          if ! grep -q 'const IMAGE_DEPENDENT_BATCH_1=' "$INDEX"; then
            python3 scripts/patch_image_dependent_batch_1.py "$INDEX"
          fi
          if ! grep -q 'const DANIEANA_DOCX_REPORT_SHARE_V1=true;' "$INDEX"; then
            python3 scripts/patch_report_docx_share.py "$INDEX"
          fi

          grep -q 'QUESTION_IMAGE_CACHE="ana-dani-question-images-v1"' "$INDEX"
          grep -q 'Baixando imagens das questões' "$INDEX"
          grep -q 'const IMAGE_DEPENDENT_BATCH_1=' "$INDEX"
          grep -q 'const DANIEANA_DOCX_REPORT_SHARE_V1=true;' "$INDEX"
          grep -q 'Compartilhar relatório DOCX' "$INDEX"
          grep -q 'navigator.share' "$INDEX"
          grep -q 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' "$INDEX"
          grep -q 'SOC-4000245684' "$INDEX"
          grep -q 'SOC-4000146570' "$INDEX"
          grep -q 'SOC-4000037773' "$INDEX"
          grep -q 'SOC-4000305647' "$INDEX"
          grep -q 'SOC-4000084413' "$INDEX"
          if grep -q 'imagePilot' "$INDEX"; then
            echo "Pilot route leaked into production package." >&2
            exit 1
          fi

          # Recompute after any base patches; HeloeSthe must mirror this exact app revision.
          ROOT_SHA="$(sha256sum "$INDEX" | awk '{print $1}')"
          if [ ! -f "$HELO/.source-sha" ] \
            || [ "$(cat "$HELO/.source-sha" 2>/dev/null || true)" != "$ROOT_SHA" ] \
            || ! grep -q 'HeloeSthe' "$HELO/index.html" 2>/dev/null \
            || ! grep -q 'Compartilhar relatório DOCX' "$HELO/index.html" 2>/dev/null; then
            python3 scripts/stage_heloesthe_subsite.py "$SITE_ROOT" "$HELO"

            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
              "https://raw.githubusercontent.com/sociosofia/heloesthe/main/scripts/bootstrap_heloesthe.py" \
              -o /tmp/bootstrap_heloesthe.py
            python3 /tmp/bootstrap_heloesthe.py "$HELO"

            mkdir -p "$HELO/icons"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
              "https://raw.githubusercontent.com/sociosofia/heloesthe/main/branding/icon-192.png.b64" \
              | base64 -d > "$HELO/icons/icon-192.png"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
              "https://raw.githubusercontent.com/sociosofia/heloesthe/main/branding/icon-512.png.b64" \
              | base64 -d > "$HELO/icons/icon-512.png"

            printf '%s' "$ROOT_SHA" > "$HELO/.source-sha"
          fi

          test -f "$HELO/index.html"
          grep -q 'HeloeSthe' "$HELO/index.html"
          grep -q 'Feito com afeto, para vocês. Estou na torcida!' "$HELO/index.html"
          grep -q 'heloesthe-local-storage-namespace' "$HELO/index.html"
          grep -q 'Compartilhar relatório DOCX' "$HELO/index.html"
          grep -q 'navigator.share' "$HELO/index.html"
          file "$HELO/icons/icon-192.png" | grep -qi 'PNG image data, 192 x 192'
          file "$HELO/icons/icon-512.png" | grep -qi 'PNG image data, 512 x 512'
          if grep -q 'Simulados da Ana e Dani' "$HELO/index.html"; then
            echo "Original Dani&Ana branding leaked into HeloeSthe." >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates=list(Path('unpacked').glob('heloesthe/index.html')) + list(Path('unpacked').glob('*/heloesthe/index.html'))
          if not candidates:
              raise SystemExit('HeloeSthe index not found after bake')
          s=candidates[0].read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not scripts:
              raise SystemExit('HeloeSthe inline application script not found')
          Path('/tmp/heloesthe-main.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/heloesthe-main.js

          rm -f "${ZIP}.new"
          (cd unpacked && zip -qr "../${ZIP}.new" .)
          mv "${ZIP}.new" "$ZIP"
          echo "BAKED=1" >> "$GITHUB_ENV"

      - name: Commit baked package
        if: env.BAKED == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Simulados_Ana_Dani_Humanas_FINAL_PWA.zip
          git diff --cached --quiet && exit 0
          git commit -m "Bake DaniAna features and HeloeSthe subsite into PWA package"
          git push origin HEAD:main
